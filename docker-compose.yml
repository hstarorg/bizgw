# One-command containerized deployment for local/dev use.
#   docker compose up -d --build
#
# NOTE: the schema is managed by EF Core Migrations, not auto-imported by this db service.
# After the db is up, create the tables once with:
#   ConnectionString="Host=localhost;Port=5432;Username=postgres;Password=localDev;Database=gatewaydb" \
#     dotnet ef database update --project GatewayServer.Data

services:
  db:
    image: postgres:18.1-alpine3.23
    environment:
      POSTGRES_PASSWORD: localDev
      POSTGRES_DB: gatewaydb
    # postgres:18 起数据目录改为 /var/lib/postgresql 下的版本化子目录,卷需挂在此处
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gatewaydb']
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: GatewayServer/Dockerfile
    environment:
      ConnectionString: 'Host=db;Port=5432;Username=postgres;Password=localDev;Database=gatewaydb'
      AuthCode: 'change-me-in-prod'
    ports:
      - '8889:8080'
    depends_on:
      db:
        condition: service_healthy

  control-plane:
    build:
      context: .
      dockerfile: GatewayServer.ControlPlane/Dockerfile
    environment:
      ConnectionString: 'Host=db;Port=5432;Username=postgres;Password=localDev;Database=gatewaydb'
    ports:
      - '8890:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
